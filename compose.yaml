name: webhook-delivery-engine

services:
  postgres:
    image: postgres:17
    profiles: [core, demo, test]
    environment:
      POSTGRES_DB: wde
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${WDE_POSTGRES_SUPERUSER_PASSWORD:-postgres-local-only}
      WDE_MIGRATOR_PASSWORD: ${WDE_MIGRATOR_PASSWORD:-migrator-local-only}
      WDE_API_DATABASE_PASSWORD: ${WDE_API_DATABASE_PASSWORD:-api-local-only}
      WDE_WORKER_DATABASE_PASSWORD: ${WDE_WORKER_DATABASE_PASSWORD:-worker-local-only}
      WDE_ADMIN_DATABASE_PASSWORD: ${WDE_ADMIN_DATABASE_PASSWORD:-admin-local-only}
    ports:
      - "127.0.0.1:${WDE_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deployments/postgres/init-local-roles.sh:/docker-entrypoint-initdb.d/010-local-roles.sh:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    profiles: [core, demo, test]
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile.migrate
    environment:
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: postgres://wde_migrator:${WDE_MIGRATOR_PASSWORD:-migrator-local-only}@postgres:5432/wde?sslmode=disable
    command: [up]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    profiles: [core, demo]
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile
      target: runtime
      args:
        SERVICE: api
    environment:
      WDE_PROFILE: local
      WDE_VERSION: compose
      WDE_LOG_LEVEL: ${WDE_LOG_LEVEL:-info}
      WDE_API_HTTP_ADDR: :8080
      WDE_API_OPERATIONAL_ADDR: :9090
      WDE_DATABASE_URL: postgres://wde_api:${WDE_API_DATABASE_PASSWORD:-api-local-only}@postgres:5432/wde?sslmode=disable
      WDE_SHUTDOWN_TIMEOUT: ${WDE_SHUTDOWN_TIMEOUT:-30s}
      WDE_DATABASE_TIMEOUT: ${WDE_DATABASE_TIMEOUT:-5s}
      WDE_ALLOW_HTTP_DESTINATIONS: "true"
      WDE_EDGE_MAX_IN_FLIGHT: ${WDE_EDGE_MAX_IN_FLIGHT:-256}
      WDE_EDGE_GLOBAL: ${WDE_EDGE_GLOBAL:-60000}
      WDE_EDGE_ORIGIN: ${WDE_EDGE_ORIGIN:-600}
      WDE_EDGE_PREFIX: ${WDE_EDGE_PREFIX:-300}
      WDE_EDGE_WINDOW: ${WDE_EDGE_WINDOW:-1m}
      WDE_EDGE_MAX_BUCKETS: ${WDE_EDGE_MAX_BUCKETS:-4096}
      WDE_QUOTA_INGEST_GLOBAL: ${WDE_QUOTA_INGEST_GLOBAL:-10000}
      WDE_QUOTA_INGEST_WORKSPACE: ${WDE_QUOTA_INGEST_WORKSPACE:-200}
      WDE_QUOTA_INGEST_API_KEY: ${WDE_QUOTA_INGEST_API_KEY:-200}
      WDE_QUOTA_INGEST_WINDOW: ${WDE_QUOTA_INGEST_WINDOW:-1s}
      WDE_QUOTA_ENDPOINT_WRITE_GLOBAL: ${WDE_QUOTA_ENDPOINT_WRITE_GLOBAL:-6000}
      WDE_QUOTA_ENDPOINT_WRITE_WORKSPACE: ${WDE_QUOTA_ENDPOINT_WRITE_WORKSPACE:-60}
      WDE_QUOTA_ENDPOINT_WRITE_API_KEY: ${WDE_QUOTA_ENDPOINT_WRITE_API_KEY:-60}
      WDE_QUOTA_ENDPOINT_WRITE_WINDOW: ${WDE_QUOTA_ENDPOINT_WRITE_WINDOW:-1m}
      WDE_QUOTA_QUERY_GLOBAL: ${WDE_QUOTA_QUERY_GLOBAL:-30000}
      WDE_QUOTA_QUERY_WORKSPACE: ${WDE_QUOTA_QUERY_WORKSPACE:-300}
      WDE_QUOTA_QUERY_API_KEY: ${WDE_QUOTA_QUERY_API_KEY:-300}
      WDE_QUOTA_QUERY_WINDOW: ${WDE_QUOTA_QUERY_WINDOW:-1m}
      WDE_QUOTA_REPLAY_GLOBAL: ${WDE_QUOTA_REPLAY_GLOBAL:-1000}
      WDE_QUOTA_REPLAY_WORKSPACE: ${WDE_QUOTA_REPLAY_WORKSPACE:-10}
      WDE_QUOTA_REPLAY_API_KEY: ${WDE_QUOTA_REPLAY_API_KEY:-10}
      WDE_QUOTA_REPLAY_RESOURCE: ${WDE_QUOTA_REPLAY_RESOURCE:-2}
      WDE_QUOTA_REPLAY_WINDOW: ${WDE_QUOTA_REPLAY_WINDOW:-1m}
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:9090:9090"
    depends_on:
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    init: true
    restart: unless-stopped

  worker:
    profiles: [core, demo]
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile
      target: runtime
      args:
        SERVICE: worker
    environment:
      WDE_PROFILE: local
      WDE_VERSION: compose
      WDE_LOG_LEVEL: ${WDE_LOG_LEVEL:-info}
      WDE_DATABASE_URL: postgres://wde_worker:${WDE_WORKER_DATABASE_PASSWORD:-worker-local-only}@postgres:5432/wde?sslmode=disable
      WDE_WORKER_OPERATIONAL_ADDR: :9091
      WDE_SHUTDOWN_TIMEOUT: ${WDE_SHUTDOWN_TIMEOUT:-30s}
      WDE_DATABASE_TIMEOUT: ${WDE_DATABASE_TIMEOUT:-5s}
      WDE_ALLOW_HTTP_DESTINATIONS: "true"
      WDE_WORKER_CONCURRENCY: ${WDE_WORKER_CONCURRENCY:-8}
      WDE_WORKER_CLAIM_BATCH_SIZE: ${WDE_WORKER_CLAIM_BATCH_SIZE:-8}
      WDE_WORKER_WORKSPACE_BATCH_LIMIT: ${WDE_WORKER_WORKSPACE_BATCH_LIMIT:-2}
      WDE_WORKER_ENDPOINT_BATCH_LIMIT: ${WDE_WORKER_ENDPOINT_BATCH_LIMIT:-2}
      WDE_WORKER_POLL_INTERVAL: ${WDE_WORKER_POLL_INTERVAL:-250ms}
      WDE_WORKER_CLAIM_TIMEOUT: ${WDE_WORKER_CLAIM_TIMEOUT:-200ms}
      WDE_WORKER_REQUEST_TIMEOUT: ${WDE_WORKER_REQUEST_TIMEOUT:-10s}
      WDE_WORKER_LEASE_TTL: ${WDE_WORKER_LEASE_TTL:-30s}
      WDE_WORKER_RETRY_BASE: ${WDE_WORKER_RETRY_BASE:-1s}
      WDE_WORKER_RETRY_CAP: ${WDE_WORKER_RETRY_CAP:-15m}
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:9091:9091"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    init: true
    restart: unless-stopped

  chaoslab:
    profiles: [demo]
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile
      target: runtime
      args:
        SERVICE: chaoslab
    environment:
      WDE_PROFILE: local
      WDE_VERSION: compose
      WDE_LOG_LEVEL: ${WDE_LOG_LEVEL:-info}
      WDE_CHAOSLAB_HTTP_ADDR: :8081
      WDE_SHUTDOWN_TIMEOUT: ${WDE_SHUTDOWN_TIMEOUT:-30s}
      WDE_ALLOW_HTTP_DESTINATIONS: "true"
    ports:
      - "127.0.0.1:8081:8081"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    init: true
    restart: unless-stopped

volumes:
  postgres-data:
