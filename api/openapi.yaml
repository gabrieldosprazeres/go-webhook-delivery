openapi: 3.1.0
info:
  title: Webhook Delivery Engine API
  version: 0.1.0
  description: Reliable at-least-once webhook delivery. Consumers deduplicate using WDE-Delivery-ID.
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
paths:
  /v1/endpoints:
    post:
      operationId: createEndpoint
      summary: Create a destination and reveal its signing secret once
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEndpoint'
      responses:
        '201':
          description: Endpoint created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedEndpoint'
        default:
          $ref: '#/components/responses/Problem'
  /v1/endpoints/{id}:
    get:
      operationId: getEndpoint
      parameters:
        - $ref: '#/components/parameters/ResourceID'
      responses:
        '200':
          description: Endpoint metadata; never includes the signing secret
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Endpoint'
        default:
          $ref: '#/components/responses/Problem'
  /v1/events:
    post:
      operationId: publishEvent
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, minLength: 1, maxLength: 128}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, data]
              properties:
                type: {type: string, maxLength: 128, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]*$'}
                data: {}
      responses:
        '202':
          description: Persisted event and delivery fan-out
          content:
            application/json:
              schema:
                type: object
                required: [event_id, delivery_ids, duplicate]
                properties:
                  event_id: {type: string, format: uuid}
                  delivery_ids: {type: array, items: {type: string, format: uuid}}
                  duplicate: {type: boolean}
        '409': {description: Idempotency key reused with different content}
        default:
          $ref: '#/components/responses/Problem'
  /v1/deliveries/{id}:
    get:
      operationId: getDelivery
      parameters:
        - $ref: '#/components/parameters/ResourceID'
      responses:
        '200':
          description: Delivery state and metadata-only attempt timeline
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Delivery'
        default:
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    ResourceID:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
  responses:
    Problem:
      description: RFC 9457 problem details
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
  schemas:
    CreateEndpoint:
      type: object
      additionalProperties: false
      required: [url, event_types]
      properties:
        url: {type: string, format: uri}
        event_types: {type: array, minItems: 1, maxItems: 100, uniqueItems: true, items: {type: string}}
    Endpoint:
      type: object
      required: [id, url, status, event_types]
      properties:
        id: {type: string, format: uuid}
        url: {type: string, format: uri}
        status: {type: string}
        event_types: {type: array, items: {type: string}}
    CreatedEndpoint:
      type: object
      required: [endpoint, signing_secret]
      properties:
        endpoint: {$ref: '#/components/schemas/Endpoint'}
        signing_secret:
          type: object
          required: [key_id, secret]
          properties:
            key_id: {type: string}
            secret: {type: string, description: Base64url secret shown only in this response}
    Delivery:
      type: object
      additionalProperties: false
      required: [id, event_id, endpoint_id, status, created_at, updated_at, attempts]
      properties:
        id: {type: string, format: uuid}
        event_id: {type: string, format: uuid}
        endpoint_id: {type: string, format: uuid}
        status:
          type: string
          enum: [pending, processing, retry_scheduled, succeeded, failed_permanent, dead_letter]
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        attempts:
          type: array
          description: Append-only metadata timeline; never contains request/response bodies, headers, payloads or secrets.
          items:
            $ref: '#/components/schemas/DeliveryAttempt'
    DeliveryAttempt:
      type: object
      additionalProperties: false
      required: [id, sequence, state, started_at]
      properties:
        id: {type: string, format: uuid}
        sequence: {type: integer, minimum: 1}
        state:
          type: string
          enum: [started, completed, abandoned]
        outcome:
          type: [string, 'null']
          enum: [success, retry, permanent_failure, stale, null]
        http_status:
          type: [integer, 'null']
          minimum: 100
          maximum: 599
        error_category:
          type: [string, 'null']
          maxLength: 64
        started_at: {type: string, format: date-time}
        finished_at:
          type: [string, 'null']
          format: date-time
    Problem:
      type: object
      required: [type, title, status, code, request_id]
      properties:
        type: {type: string}
        title: {type: string}
        status: {type: integer}
        code: {type: string}
        request_id: {type: string}
