openapi: 3.1.0
info:
  title: Webhook Delivery Engine API
  version: 0.5.0
  description: |-
    Reliable at-least-once webhook delivery. Event acceptance is not delivery success.
    Consumers verify HMAC v1 within a five-minute window and deduplicate using WDE-Delivery-ID.
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
paths:
  /v1/endpoints:
    post:
      operationId: createEndpoint
      summary: Create a destination and reveal its signing secret once
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEndpoint'
            example:
              url: https://receiver.example/webhooks
              event_types: [invoice.created]
      responses:
        '201':
          description: Endpoint created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedEndpoint'
              example:
                endpoint:
                  id: 018f0f5b-6e2e-7b5f-8f71-71f77f623001
                  url: https://receiver.example/webhooks
                  status: active
                  event_types: [invoice.created]
                signing_secret:
                  key_id: synthetic-key-001
                  secret: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA
        '429':
          $ref: '#/components/responses/QuotaExceeded'
        default:
          $ref: '#/components/responses/Problem'
  /v1/endpoints/{id}:
    get:
      operationId: getEndpoint
      parameters:
        - $ref: '#/components/parameters/ResourceID'
      responses:
        '200':
          description: Endpoint metadata; never includes the signing secret
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Endpoint'
        '429':
          $ref: '#/components/responses/QuotaExceeded'
        default:
          $ref: '#/components/responses/Problem'
  /v1/endpoints/{id}/secret-rotations:
    post:
      operationId: rotateEndpointSecret
      summary: Rotate the HMAC secret with a bounded dual-signing overlap
      parameters:
        - $ref: '#/components/parameters/ResourceID'
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, minLength: 1, maxLength: 128}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RotateSecretRequest'
            example: {overlap_seconds: 3600}
      responses:
        '202':
          description: Rotation accepted; the new secret is revealed in this idempotent response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RotateSecretResult'
              example:
                endpoint_id: 018f0f5b-6e2e-7b5f-8f71-71f77f623001
                signing_secret:
                  key_id: synthetic-key-002
                  secret: MTExMTExMTExMTExMTExMTExMTExMTExMTExMTExMTE
                duplicate: false
        '409':
          description: Rotation conflict, overlap in progress, or idempotent result whose secret expired
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/QuotaExceeded'
        default:
          $ref: '#/components/responses/Problem'
  /v1/events:
    post:
      operationId: publishEvent
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, minLength: 1, maxLength: 128}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, data]
              properties:
                type: {type: string, maxLength: 128, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]*$'}
                data: {}
            example:
              type: invoice.created
              data: {invoice_id: inv_demo_001, amount: 1999}
      responses:
        '202':
          description: Persisted event and delivery fan-out
          content:
            application/json:
              schema:
                type: object
                required: [event_id, delivery_ids, duplicate]
                properties:
                  event_id: {type: string, format: uuid}
                  delivery_ids: {type: array, items: {type: string, format: uuid}}
                  duplicate: {type: boolean}
              example:
                event_id: 018f0f5b-6e2e-7b5f-8f71-71f77f623002
                delivery_ids: [018f0f5b-6e2e-7b5f-8f71-71f77f623003]
                duplicate: false
        '409':
          description: Idempotency key reused with different content
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/QuotaExceeded'
        default:
          $ref: '#/components/responses/Problem'
  /v1/deliveries/{id}:
    get:
      operationId: getDelivery
      parameters:
        - $ref: '#/components/parameters/ResourceID'
      responses:
        '200':
          description: Delivery state and metadata-only attempt timeline
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Delivery'
        '429':
          $ref: '#/components/responses/QuotaExceeded'
        default:
          $ref: '#/components/responses/Problem'
  /v1/deliveries:
    get:
      operationId: listDeliveries
      summary: List tenant-scoped delivery metadata using an opaque cursor
      parameters:
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 50}
        - name: cursor
          in: query
          schema: {type: string, maxLength: 256}
      responses:
        '200':
          description: Bounded delivery page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryPage'
        '400':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/QuotaExceeded'
        default:
          $ref: '#/components/responses/Problem'
  /v1/deliveries/{id}/replays:
    post:
      operationId: replayDelivery
      summary: Start an idempotent, audited delivery generation
      parameters:
        - $ref: '#/components/parameters/ResourceID'
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, minLength: 1, maxLength: 128}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplayRequest'
            example: {reason: Operator confirmed receiver recovery}
      responses:
        '202':
          description: Replay accepted or the identical prior command returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplayResult'
              example:
                command_id: 018f0f5b-6e2e-7b5f-8f71-71f77f623004
                delivery_id: 018f0f5b-6e2e-7b5f-8f71-71f77f623003
                run_number: 2
                duplicate: false
        '409':
          description: Idempotency conflict, invalid transition or purged payload
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '415':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/QuotaExceeded'
        default:
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: API key revealed once by local bootstrap; never place it in URLs.
  parameters:
    ResourceID:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
  responses:
    Problem:
      description: RFC 9457 problem details
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    QuotaExceeded:
      description: A bounded local or persistent quota was exceeded
      headers:
        Retry-After:
          required: true
          schema: {type: integer, minimum: 1}
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    CreateEndpoint:
      type: object
      additionalProperties: false
      required: [url, event_types]
      properties:
        url: {type: string, format: uri}
        event_types: {type: array, minItems: 1, maxItems: 100, uniqueItems: true, items: {type: string}}
    Endpoint:
      type: object
      required: [id, url, status, event_types]
      properties:
        id: {type: string, format: uuid}
        url: {type: string, format: uri}
        status: {type: string}
        event_types: {type: array, items: {type: string}}
    CreatedEndpoint:
      type: object
      additionalProperties: false
      required: [endpoint, signing_secret]
      properties:
        endpoint: {$ref: '#/components/schemas/Endpoint'}
        signing_secret:
          type: object
          additionalProperties: false
          required: [key_id, secret]
          properties:
            key_id: {type: string}
            secret: {type: string, description: Base64url secret shown only in this response}
    RotateSecretRequest:
      type: object
      additionalProperties: false
      properties:
        overlap_seconds: {type: integer, minimum: 3600, maximum: 604800, default: 86400}
    RotateSecretResult:
      type: object
      additionalProperties: false
      required: [endpoint_id, signing_secret, duplicate]
      properties:
        endpoint_id: {type: string, format: uuid}
        signing_secret:
          type: object
          additionalProperties: false
          required: [key_id, secret]
          properties:
            key_id: {type: string}
            secret: {type: string, description: Base64url secret returned only by this idempotent command}
        duplicate: {type: boolean}
    Delivery:
      type: object
      additionalProperties: false
      required: [id, event_id, endpoint_id, status, created_at, updated_at, attempts]
      properties:
        id: {type: string, format: uuid}
        event_id: {type: string, format: uuid}
        endpoint_id: {type: string, format: uuid}
        status:
          type: string
          enum: [pending, processing, retry_scheduled, succeeded, failed_permanent, dead_letter]
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        attempts:
          type: array
          description: Append-only metadata timeline; never contains request/response bodies, headers, payloads or secrets.
          items:
            $ref: '#/components/schemas/DeliveryAttempt'
    DeliverySummary:
      type: object
      additionalProperties: false
      required: [id, event_id, endpoint_id, status, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        event_id: {type: string, format: uuid}
        endpoint_id: {type: string, format: uuid}
        status:
          type: string
          enum: [pending, processing, retry_scheduled, succeeded, failed_permanent, dead_letter]
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    DeliveryPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 100
          items: {$ref: '#/components/schemas/DeliverySummary'}
        next_cursor: {type: string, maxLength: 256}
    ReplayRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: {type: string, minLength: 1, maxLength: 500}
    ReplayResult:
      type: object
      additionalProperties: false
      required: [command_id, delivery_id, run_number, duplicate]
      properties:
        command_id: {type: string, format: uuid}
        delivery_id: {type: string, format: uuid}
        run_number: {type: integer, minimum: 2}
        duplicate: {type: boolean}
    DeliveryAttempt:
      type: object
      additionalProperties: false
      required: [id, sequence, state, started_at]
      properties:
        id: {type: string, format: uuid}
        sequence: {type: integer, minimum: 1}
        state:
          type: string
          enum: [started, completed, abandoned]
        outcome:
          type: [string, 'null']
          enum: [success, retry, permanent_failure, stale, null]
        http_status:
          type: [integer, 'null']
          minimum: 100
          maximum: 599
        error_category:
          type: [string, 'null']
          maxLength: 64
        started_at: {type: string, format: date-time}
        finished_at:
          type: [string, 'null']
          format: date-time
    Problem:
      type: object
      required: [type, title, status, code, request_id]
      properties:
        type: {type: string}
        title: {type: string}
        status: {type: integer}
        code: {type: string}
        request_id: {type: string}
