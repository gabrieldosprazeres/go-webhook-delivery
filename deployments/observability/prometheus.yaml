global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: wde-api
    static_configs:
      - targets: ["api:9090"]
  - job_name: wde-worker
    static_configs:
      - targets: ["worker:9091"]
  - job_name: wde-console
    static_configs:
      - targets: ["console:9092"]
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]
