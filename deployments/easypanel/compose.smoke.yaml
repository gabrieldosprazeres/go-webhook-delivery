services:
  api:
    ports:
      - 127.0.0.1:18080:8080
      - 127.0.0.1:19090:9090
  worker:
    ports:
      - 127.0.0.1:19091:9091
  console:
    ports:
      - 127.0.0.1:18083:8082
      - 127.0.0.1:19092:9092
  otel-collector:
    ports:
      - 127.0.0.1:14318:4318
      - 127.0.0.1:13133:13133
    networks: [telemetry-private, smoke-host-access]
  prometheus:
    ports:
      - 127.0.0.1:19093:9090
    networks: [telemetry-private, smoke-host-access]
  tempo:
    ports:
      - 127.0.0.1:13200:3200
    networks: [telemetry-private, smoke-host-access]
  showcase:
    ports:
      - 127.0.0.1:18081:8080
  swagger:
    ports:
      - 127.0.0.1:18082:8080

networks:
  # CI-only bridge: Docker cannot publish loopback ports for containers that
  # are connected exclusively to an internal network.
  smoke-host-access:
    internal: false
